[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openspacehdl"
dynamic = ["version"]
description = "Open Space HDL, open-source VHDL IP cores for spacecraft on-board data handling: early release that lists the family"
readme = "README.md"
license = "MIT AND LicenseRef-PSI-HDL-1.0 AND Apache-2.0 AND CC-BY-4.0 AND OFL-1.1 AND LicenseRef-OpenSpaceHDL-Logo"
license-files = ["LICENSE", "src/openspacehdl/licenses/*.txt", "src/openspacehdl/licenses/*.md"]
requires-python = ">=3.10"
authors = [{ name = "Julian Schneider", email = "julian.schneider@openspacehdl.org" }]
keywords = ["vhdl", "fpga", "ip-core", "space", "spacewire", "spacefibre", "ccsds", "ecss"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
# the VUnit versions the package is tested with: 4.7.1 and the 5.0 line (a development release with an explicit pin)
vunit = ["vunit_hdl>=4.7.1,<5.1"]

[project.urls]
Homepage = "https://openspacehdl.org"

[project.scripts]
openspacehdl = "openspacehdl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openspacehdl.__version__" }

[tool.setuptools.package-data]
openspacehdl = ["data/*.json", "data/schema/*.json", "licenses/*", "templates/*", "osh_tb/*.vhd","hdl/**/*", "bundles/*.bundle",
                "portal/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Limits of the wheel (docs/design.md, rules L8 and L9): the longest path in the wheel stays below path-limit
# minus install-prefix characters, the wheel below the PyPI file limit of the project.
[tool.openspacehdl]
path-limit = 260
install-prefix = 120
pypi-file-limit-mb = 100
